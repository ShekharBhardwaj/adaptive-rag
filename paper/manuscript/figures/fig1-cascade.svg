<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="The vector-first cascade" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif'>
<rect width="760" height="250" fill="#ffffff"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="tip-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<rect x="14" y="34" width="96" height="56" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="62.0" y="66.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Question</text>
<rect x="150" y="34" width="150" height="56" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="225.0" y="58.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Vector search</text><text x="225.0" y="74.5" font-size="13" fill="#52514e" text-anchor="middle">top 5 chunks</text>
<rect x="340" y="34" width="190" height="56" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="435.0" y="50.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Answer model</text><text x="435.0" y="66.5" font-size="13" fill="#52514e" text-anchor="middle">answer, citations and</text><text x="435.0" y="82.5" font-size="13" fill="#52514e" text-anchor="middle">“evidence sufficient?”</text>
<rect x="600" y="34" width="146" height="56" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="673.0" y="66.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">First answer</text>
<rect x="150" y="162" width="190" height="56" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/><text x="245.0" y="178.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Agentic navigation</text><text x="245.0" y="194.5" font-size="13" fill="#52514e" text-anchor="middle">reserved selection,</text><text x="245.0" y="210.5" font-size="13" fill="#52514e" text-anchor="middle">at most 5 chunks</text>
<rect x="380" y="162" width="150" height="56" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="455.0" y="186.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Answer model</text><text x="455.0" y="202.5" font-size="13" fill="#52514e" text-anchor="middle">same prompt</text>
<rect x="600" y="162" width="146" height="56" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="673.0" y="194.5" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Second answer</text>
<line x1="110" y1="62.0" x2="148" y2="62.0" stroke="#898781" stroke-width="1.25" marker-end="url(#tip)"/>
<line x1="300" y1="62.0" x2="338" y2="62.0" stroke="#898781" stroke-width="1.25" marker-end="url(#tip)"/>
<line x1="530" y1="62.0" x2="598" y2="62.0" stroke="#898781" stroke-width="1.25" marker-end="url(#tip)"/>
<text x="564.0" y="54.0" font-size="13" fill="#52514e" text-anchor="middle">sufficient</text>
<text x="564.0" y="80.0" font-size="13" fill="#898781" text-anchor="middle">25 of 45</text>
<path d="M435,90 V126.0 H245 V160" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#tip-accent)"/>
<text x="445.0" y="120.0" font-size="13" fill="#52514e">insufficient, or the first stage failed</text>
<text x="445.0" y="135.0" font-size="13" fill="#898781">20 of 45</text>
<line x1="340" y1="190.0" x2="378" y2="190.0" stroke="#2a78d6" stroke-width="2" marker-end="url(#tip-accent)"/>
<line x1="530" y1="190.0" x2="598" y2="190.0" stroke="#2a78d6" stroke-width="2" marker-end="url(#tip-accent)"/>
<text x="14.0" y="242.0" font-size="13" fill="#898781">If the second stage does not complete, the completed first answer is kept. Counts are held-out jobs.</text>
</svg>
