[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adaptive-rag-research"
version = "0.4.0"
description = "Reproducible foundations for research on adaptive repository retrieval"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
vector = ["faiss-cpu>=1.10,<2", "numpy>=1.26,<3"]
parse = ["tree-sitter>=0.25,<0.27", "tree-sitter-python>=0.23,<0.26", "tree-sitter-javascript>=0.23,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.scripts]
adaptive-rag = "adaptive_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
