# Copy to configs/experiment.local.yaml and choose actual endpoint/model IDs.
# Author and independently review benchmarks/pilot.jsonl before planning a run.
schema_version: "1"
repository:
  url: https://github.com/langchain-ai/langchain.git
  path: ../datasets/repos/langchain
  commit_sha: ea17e48f0a4336c920394fd029de99f1568b4c38
files:
  max_file_bytes: 1000000
models:
  base_url: http://localhost:8000/v1
  api_key_env: LOCAL_LLM_API_KEY
  embedding_model: REPLACE_WITH_EMBEDDING_MODEL_ID
  chat_model: REPLACE_WITH_TOOL_CAPABLE_CHAT_MODEL_ID
  temperature: 0.0
  max_output_tokens: 512
  token_parameter: max_tokens
retrieval:
  top_k: 5
  budget:
    max_tool_calls: 20
    max_model_calls: 8
    max_tokens: 16000
    max_seconds: 30
    max_evidence_chars: 24000
  indexing_budget:
    max_model_calls: 1000
    max_tokens: 1000000
    max_seconds: 600
  chunking:
    max_lines: 80
    max_chars: 12000
    overlap_lines: 8
    parser: auto
  embedding_batch_size: 32
experiment:
  dataset: ../benchmarks/pilot.jsonl
  split: development
  conditions: [vector, vectorless, agentic, no_retrieval]
  repetitions: 3
  order_seed: 17
  vector_index: ../datasets/indexes/langchain-001
  require_pilot: true
  # null uses models.chat_model for answers across every condition.
  answer_model: null
  generation:
    temperature: 0.0
    max_output_tokens: 1024
    max_tokens: 16000
    max_seconds: 30
    max_evidence_chars: 24000
  budget:
    max_model_calls: 1000
    max_tokens: 1000000
    max_seconds: 3600
    # Optional estimate cap; requires an explicit dated price schedule below.
    max_cost_usd: null
  price_schedule: null
